<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b5bf7" />
    <meta name="description" content="Work. Play. Stay Connected. Global with CHATme." />
    <title>CHATme</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Critical CSS is inline so the shell paints on the first round trip with zero
      blocking requests. The static shell below is visible before any JavaScript runs.
    -->
    <style>
      :root{--bg:#f7f7fb;--fg:#12131a;--muted:#5c6070;--card:#fff;--line:#e3e4ec;--brand:#5b5bf7;--brand-fg:#fff;--danger:#c62828;--ok:#1b7f3a;color-scheme:light dark}
      @media (prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#eef0f7;--muted:#a3a8bb;--card:#141a2e;--line:#262d45;--danger:#ff6b6b;--ok:#55c27a}}
      *{box-sizing:border-box}html,body{margin:0;height:100%}
      body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Thai","Noto Sans JP","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
      .shell{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
      .brand{font-weight:800;font-size:28px;letter-spacing:-.02em}.brand b{color:var(--brand)}
      .pulse{width:40px;height:4px;border-radius:2px;background:var(--brand);opacity:.6;animation:p 1.2s ease-in-out infinite}
      @keyframes p{50%{opacity:.15}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app">
      <div class="shell" aria-busy="true">
        <div class="brand"><b>CHAT</b>me</div>
        <div class="pulse"></div>
      </div>
    </div>
    <noscript>CHATme needs JavaScript enabled.</noscript>
  </body>
</html>
